name: Validation

on:
  pull_request:
    branches: [main]
    paths: ['desktop/**', 'shared/**', 'credits-service/**', 'tests/**', 'lib/**', 'scripts/**', '.github/**', 'package*.json', '*config*', '.npmrc', 'electron-builder*.cjs', 'build/**', 'types/**', 'public/**']
  push:
    branches: [main]
    paths: ['desktop/**', 'shared/**', 'credits-service/**', 'tests/**', 'lib/**', 'scripts/**', '.github/**', 'package*.json', '*config*', '.npmrc', 'electron-builder*.cjs', 'build/**', 'types/**', 'public/**']
  workflow_call:
    inputs:
      browser_checks:
        type: boolean
        default: true
      live_zoom:
        type: boolean
        default: false
      zoox:
        type: boolean
        default: false
      lyft:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      browser_checks:
        description: Run native Windows Boards and renderer checks
        type: boolean
        default: true
      live_zoom:
        description: Also verify the live filtered Zoom route
        type: boolean
        default: false
      zoox:
        description: Also verify the filtered Zoox board
        type: boolean
        default: false
      lyft:
        description: Also verify the filtered Lyft board
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  general:
    name: General checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
      - run: npm test
      - run: npm run test:chatgpt
      - name: Verify storage safety
        run: node --test scripts/prune-actions-storage.test.mjs scripts/archive-store-package.test.mjs
      - run: npm run desktop:build
      - name: Verify public ChatGPT integration and distribution boundaries
        run: node scripts/verify-chatgpt-build.mjs
      - run: npm run credits:build

  layers:
    name: Native Boards checks (Windows)
    needs: general
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || inputs.browser_checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run desktop:build
      - run: npm run credits:build
      - name: Verify all native Boards regressions
        run: node scripts/qa-boards-ci.mjs
        env:
          LIVE_ZOOM: ${{ inputs.live_zoom }}
          CHECK_ZOOX: ${{ inputs.zoox }}
          CHECK_LYFT: ${{ inputs.lyft }}
          ZEBBY_RECOVERY_IMAGE_LOGS: '1'
      - name: Prepare service and provider verification
        run: |
          node scripts/build-credits-service.mjs --standalone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-boards-smoke.mjs
      - run: node node_modules/playwright-core/cli.js install chromium
      - name: Verify listing inspection and both appearances
        run: npm run test:renderer
        env:
          ZEBBY_CAPTURE_BOARDS: '1'
      - name: Verify ChatGPT Settings, Usage and public updates
        run: npm run test:chatgpt:renderer
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: boards-validation
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            qa-output/board-layers/*.json
            qa-output/board-layers/*.jpg
            qa-output/board-evidence/*.json
            qa-output/board-evidence/*.jpg
            qa-output/slack-board/*.json
            qa-output/twitch-reader/*.json
            qa-output/boards-reader/*.json
            qa-output/boards-recovery/*.json
            qa-output/boards-recovery/*.png
            qa-output/chatgpt/*.json
            qa-output/chatgpt/*.txt
            qa-output/chatgpt/*.png
            qa-output/renderer-1.5.0/*.png
            .impeccable/review/boards-*.png
            credits-service/dist/server.mjs
            credits-service/dist/provider-smoke.mjs
