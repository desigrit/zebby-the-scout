name: Android preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'desktop/analysis-contracts.ts'
      - 'shared/online-models.ts'
      - 'scripts/export-android-contracts.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/export-android-contracts.mjs --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and build
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --console=plain
      - name: Collect preview
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Zebby-Android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zebby-Android-preview
          path: Zebby-Android-preview.apk
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          retention-days: 1
