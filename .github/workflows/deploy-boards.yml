name: Verify the Boards service and release desktop

on:
  push:
    branches: [main]
    paths: ['credits-service/**', 'shared/boards.ts', 'shared/board-exploration.ts', 'shared/board-image.ts', 'shared/analysis-images.ts', '.github/workflows/deploy-boards.yml']
  workflow_dispatch:

concurrency:
  group: production-credits-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  samples:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Capture native visual reading evidence
        run: |
          node --input-type=module -e "import { build } from 'esbuild'; await build({ entryPoints:['scripts/qa-board-layers.mjs'], outfile:'qa-output/board-layers/runner.mjs', bundle:true, platform:'node', format:'esm', target:'node22', external:['electron'] });"
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd qa-output/board-layers/runner.mjs
      - run: node scripts/qa-board-reader.mjs "https://www.figma.com/careers/#job-openings"
      - name: Capture thorough reading evidence
        run: |
          node --input-type=module -e "import { build } from 'esbuild'; await build({ entryPoints:['scripts/qa-board-thorough.mjs'], outfile:'qa-output/board-layers/thorough.mjs', bundle:true, platform:'node', format:'esm', target:'node22', external:['electron'] });"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd qa-output/board-layers/thorough.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: boards-provider-samples
          path: |
            qa-output/boards-reader/figma-sample.json
            qa-output/board-layers/visual-sample.json
            qa-output/board-layers/thorough-sample.json
          if-no-files-found: error
          retention-days: 2

  bundle:
    needs: samples
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify the release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: boards-provider-samples
          path: qa-output
      - name: Build the service and provider check
        run: |
          node scripts/build-credits-service.mjs --standalone
          node scripts/build-boards-smoke.mjs
      - name: Publish the service bundle for Azure Run Command
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          tag="credits-$RELEASE_VERSION-${GITHUB_SHA:0:12}"
          name="zebby-credits-$GITHUB_SHA.tar.gz"
          cd credits-service/dist
          cp ../deploy/promote.sh .
          sha256sum server.mjs provider-smoke.mjs > SHA256SUMS
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$name" server.mjs provider-smoke.mjs promote.sh SHA256SUMS
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
            mkdir verified
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$name" -D verified
            tar -xOf "verified/$name" server.mjs | cmp server.mjs -
            tar -xOf "verified/$name" provider-smoke.mjs | cmp provider-smoke.mjs -
            tar -xOf "verified/$name" promote.sh | cmp promote.sh -
            sha256sum "verified/$name" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            gh release create "$tag" "$name" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Credits service ${GITHUB_SHA:0:12}" --notes "Standalone Azure service bundle for the public Boards release."
          fi
          sha256sum "$name" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: boards-provider-samples
          path: qa-output
      - name: Verify the deployed revision and both ordinary wallet quote paths
        run: node --experimental-strip-types scripts/qa-public-boards-service.mjs "$GITHUB_SHA"

  tag:
    needs: [bundle, verify]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Tag the verified main commit and start desktop packaging
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          test "$(gh api "$repo/commits/main" --jq .sha)" = "$GITHUB_SHA"
          tag="v$RELEASE_VERSION"
          if existing=$(gh api "$repo/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          gh workflow run msix-validation.yml -R "$GITHUB_REPOSITORY" --ref "$tag"
          gh workflow run desktop-packages.yml -R "$GITHUB_REPOSITORY" --ref "$tag"
