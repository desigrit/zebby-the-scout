name: Live Boards checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/board-browser.ts'
      - 'desktop/netflix-board.ts'
      - 'desktop/board-page.ts'
      - 'desktop/boards-scan.ts'
      - 'scripts/qa-board-reader.mjs'
      - 'scripts/qa-netflix-board.mjs'
      - '.github/workflows/netflix-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      NETFLIX_BOARD: 'https://explore.jobs.netflix.net/careers?Teams=Product%20Management&Region=ucan&domain=netflix.com&sort_by=relevance'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the filtered Netflix board, cancellation and retry
        run: node scripts/qa-board-reader.mjs "$env:NETFLIX_BOARD"
      - name: Verify Figma Product heading and role instructions
        run: node scripts/qa-board-reader.mjs "https://www.figma.com/careers/#job-openings"
