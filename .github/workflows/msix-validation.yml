name: Installed Microsoft Store package

on:
  workflow_dispatch:
  push:
    branches: [store/msix]

permissions:
  contents: read

concurrency:
  group: msix-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ZEBBY_CREDITS_SERVICE_URL: https://zebby-credits.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Prepare temporary package identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/msix -Force | Out-Null
          @{
            identityName = 'Zebby.StoreQA'
            publisher = 'CN=Zebby Store QA'
            publisherDisplayName = 'Zebby Store QA'
          } | ConvertTo-Json | Set-Content -LiteralPath work/msix/qa-identity.json -Encoding utf8NoBOM
      - name: Build an unsigned Store package for validation
        run: node scripts/build-msix.mjs --identity work/msix/qa-identity.json --output work/msix/ci --architectures x64
      - name: Install, exercise and remove the temporary signed copy
        shell: powershell
        run: ./scripts/qa-msix-installed.ps1 -BuildOutput work/msix/ci
        env:
          ZEBBY_MSIX_QA_RUNNER: ${{ runner.environment }}
      - name: Save validation results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-installed-x64-validation
          retention-days: 1
          path: |
            work/msix/ci/Validation/**/*.json
            work/msix/ci/Validation/**/*.log
            work/msix/ci/Validation/**/*.png
          if-no-files-found: error
