name: Installed Microsoft Store package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/boards-store.ts'
      - 'scripts/published-store-identity.mjs'
      - '.github/workflows/msix-validation.yml'
  push:
    branches: [store/msix]
    tags: ['v2.7.0']

permissions:
  contents: read

concurrency:
  group: msix-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ZEBBY_CREDITS_SERVICE_URL: https://zebby-credits-9d5bde.westus2.cloudapp.azure.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Resolve the published Zebby identity
        id: identity
        continue-on-error: true
        env:
          ZEBBY_STORE_IDENTITY_JSON: ${{ vars.ZEBBY_STORE_IDENTITY_JSON }}
        run: node scripts/published-store-identity.mjs public-store-identity.json
      - name: Prepare temporary package identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/msix -Force | Out-Null
          @{
            identityName = 'Zebby.StoreQA'
            publisher = 'CN=Zebby Store QA'
            publisherDisplayName = 'Zebby Store QA'
          } | ConvertTo-Json | Set-Content -LiteralPath work/msix/qa-identity.json -Encoding utf8NoBOM
      - name: Build an unsigned Store package for validation
        run: node scripts/build-msix.mjs --identity work/msix/qa-identity.json --output work/msix/ci
      - name: Verify interactive Windows PowerShell finalization for both architectures
        run: node scripts/qa-msix-finalizer.mjs --output work/msix/ci
        env:
          ZEBBY_MSIX_QA_RUNNER: ${{ runner.environment }}
      - name: Install, exercise and remove the temporary signed copy
        shell: powershell
        run: ./scripts/qa-msix-installed.ps1 -BuildOutput work/msix/ci
        env:
          ZEBBY_MSIX_QA_RUNNER: ${{ runner.environment }}
      - name: Package the unsigned Partner Center bundle
        if: steps.identity.outcome == 'success'
        run: node scripts/build-msix.mjs --reuse-payloads --payloads "work/msix/ci/Source and build/payloads" --identity public-store-identity.json --output work/msix/public
      - name: Save the Partner Center upload
        if: steps.identity.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: store-submission-bundle
          retention-days: 14
          if-no-files-found: error
          path: |
            work/msix/public/Packages/*.msixbundle
            work/msix/public/Validation/package-status.json
      - name: Require the registered Store identity for a release build
        if: startsWith(github.ref, 'refs/tags/') && steps.identity.outcome != 'success'
        run: throw 'Set ZEBBY_STORE_IDENTITY_JSON to the registered Partner Center identity and retry this run.'
      - name: Show the installed package failure
        if: failure()
        shell: pwsh
        run: |
          $log = 'work/msix/ci/Validation/installed/smoke.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 70 }
          $report = 'work/msix/ci/Validation/installed/smoke-report.json'
          if (Test-Path -LiteralPath $report) { (Get-Content -LiteralPath $report -Raw | ConvertFrom-Json).error }
      - name: Save validation results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-installed-x64-validation
          retention-days: 1
          path: |
            work/msix/ci/Validation/**/*.json
            work/msix/ci/Validation/**/*.log
            work/msix/ci/Validation/**/*.png
          if-no-files-found: error
