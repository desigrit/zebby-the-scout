name: Actions storage maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: actions-storage-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Maintenance always executes trusted default-branch code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify storage safety
        run: node --test scripts/prune-actions-storage.test.mjs scripts/archive-store-package.test.mjs
      - name: Preserve the released Microsoft Store package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/archive-store-package.mjs --apply
      - name: Remove superseded build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-actions-storage.mjs --apply
