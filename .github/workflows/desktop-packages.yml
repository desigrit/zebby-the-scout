name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      verify_updates_only:
        description: Verify an already-published release without rebuilding installers
        type: boolean
        default: false
      published_version:
        description: Published version to verify, such as 2.10.1
        type: string
        required: false
      compare_mac_release:
        description: Optional previous Mac release tag to inspect
        type: string
        required: false
      mac_only:
        description: Run only Mac packaging checks
        type: boolean
        default: false
      review_only:
        description: Run desktop UI checks and capture synthetic screenshots without packaging
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'scripts/export-android-contracts.mjs'
      - 'docs/**'
      - '.impeccable/**'
      - 'README.md'
      - 'PRODUCT.md'
      - 'DESIGN.md'
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Public endpoint only. Payment, auth, and model keys belong on the service host.
  ZEBBY_CREDITS_SERVICE_URL: ${{ vars.ZEBBY_CREDITS_SERVICE_URL }}

jobs:
  desktop-visual-review:
    if: github.event_name == 'workflow_dispatch' && inputs.review_only && !inputs.verify_updates_only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
      - run: npm run desktop:build
      - name: Capture isolated Windows desktop and keyboard flows
        run: npm run test:desktop:windows
        env:
          ZEBBY_QA_OUTPUT: work/desktop-visual-review
      - run: node node_modules/playwright-core/cli.js install chromium
      - run: npm run test:renderer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-visual-review
          retention-days: 1
          path: |
            work/desktop-visual-review/manifest.json
            work/desktop-visual-review/failure.json
            work/desktop-visual-review/captures/*.png
            qa-output/renderer-1.5.0/*.png
          if-no-files-found: error

  windows-x64:
    if: github.event_name != 'workflow_dispatch' || (!inputs.mac_only && !inputs.review_only && !inputs.verify_updates_only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
      - run: npm run desktop:build
      - name: Check native analysis cancellation and keyboard flows
        run: npm run test:desktop:windows
        env:
          ZEBBY_QA_CHECKS_ONLY: "1"
          ZEBBY_QA_OUTPUT: work/ember-native-qa
      - run: npm run test:resume-files
      - name: Save native failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-failure
          retention-days: 1
          path: work/ember-native-qa/failure*
          if-no-files-found: ignore
      - run: node --experimental-strip-types scripts/qa-local-engine.mjs smollm2-360m
      - name: Check Qwen thinking mode on local hardware
        run: node --experimental-strip-types scripts/qa-local-engine.mjs qwen3-06b --thinking
      - run: node node_modules/playwright-core/cli.js install chromium
      - run: npm run test:renderer
      - name: Save credits flow review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credits-renderer-qa-windows
          retention-days: 1
          path: qa-output/renderer-1.5.0/credits-*.png
          if-no-files-found: ignore
      - run: npm run credits:build
      - run: npx electron-builder --win nsis --x64 --publish never -c electron-builder.local.cjs
      - run: node scripts/qa-self-update-windows.mjs
      - run: node scripts/qa-packaged-engine.mjs
      - run: node scripts/qa-packaged-engine.mjs lfm25-350m
      - run: node scripts/qa-packaged-engine.mjs gemma3-270m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-engine-qa-windows
          retention-days: 1
          path: work/local-engine-qa/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: zebby-windows-x64
          retention-days: 1
          path: desktop-packages/*-win-x64.exe
          if-no-files-found: error
      - run: node scripts/download-electron-arm64.mjs
      - run: npx electron-builder --win nsis --arm64 --publish never -c electron-builder.arm64.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: zebby-windows-arm64
          retention-days: 1
          path: desktop-packages/*-win-arm64.exe
          if-no-files-found: error

  macos-arm64:
    if: github.event_name != 'workflow_dispatch' || (!inputs.review_only && !inputs.verify_updates_only)
    runs-on: macos-26
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Only ad-hoc signing is configured; this job has no signing credentials.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run desktop:build
      - run: npm run test:resume-files
      - run: node --experimental-strip-types scripts/qa-local-engine.mjs smollm2-360m
      - name: Check Qwen thinking mode on local hardware
        run: node --experimental-strip-types scripts/qa-local-engine.mjs qwen3-06b --thinking
      - run: node node_modules/playwright-core/cli.js install chromium
      - run: npm run test:renderer
      - name: Save credits flow review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credits-renderer-qa-macos
          retention-days: 1
          path: qa-output/renderer-1.5.0/credits-*.png
          if-no-files-found: ignore
      - run: npx electron-builder --mac dmg --arm64 --publish never
      - name: Verify distributed Mac bundle and first launch on Tahoe
        run: node scripts/qa-mac-distribution.mjs
        env:
          ZEBBY_MAC_COMPARE_RELEASE: ${{ inputs.compare_mac_release }}
          GH_TOKEN: ${{ github.token }}
      - run: node --experimental-strip-types scripts/qa-self-update-mac.mjs
      - run: node scripts/qa-packaged-engine.mjs
      - run: node scripts/qa-packaged-engine.mjs lfm25-350m
      - run: node scripts/qa-packaged-engine.mjs gemma3-270m
      - name: Check streamed Mac analysis with full-length synthetic postings and resumes
        run: |
          node scripts/qa-packaged-engine.mjs smollm2-360m --long-input
          node scripts/qa-packaged-engine.mjs lfm25-350m --long-input
          node scripts/qa-packaged-engine.mjs gemma3-270m --long-input
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-distribution-qa
          retention-days: 1
          path: work/mac-distribution-qa/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-engine-qa-macos
          retention-days: 1
          path: work/local-engine-qa/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: zebby-macos-arm64
          retention-days: 1
          path: desktop-packages/*-mac-arm64.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.verify_updates_only
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          pattern: zebby-*
          path: release-files
          merge-multiple: true
      - name: Carry forward the published Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=Zebby-0.2.0-Android-preview.apk
          gh release download v2.6.4 -R "$GITHUB_REPOSITORY" -p "$name" -D release-files
          echo "78da3b019b4b6c196adcbe7f2e9fc376207529f7dfb5b22018ae550e473e6d4d  release-files/$name" | sha256sum --check
      - name: Publish direct installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(release-files/*.exe release-files/*.dmg)
          if [[ -f release-files/Zebby-0.2.0-Android-preview.apk ]]; then assets+=(release-files/Zebby-0.2.0-Android-preview.apk); fi
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "Zebby $GITHUB_REF_NAME" --notes-file "$notes" --target "$GITHUB_SHA"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "Zebby $GITHUB_REF_NAME" --generate-notes --target "$GITHUB_SHA"
          fi

  verify-boards-update:
    needs: release
    if: always() && ((startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.verify_updates_only))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v2.6.4
          path: previous-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open a disposable copy of the previous Mac distribution for the updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.6.4 -R "$GITHUB_REPOSITORY" --pattern 'Zebby-2.6.4-mac-arm64.dmg' --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/previous" "$RUNNER_TEMP/original-volume"
          hdiutil attach "$RUNNER_TEMP/Zebby-2.6.4-mac-arm64.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/original-volume"
          ditto "$RUNNER_TEMP/original-volume/Zebby.app" "$RUNNER_TEMP/previous/Zebby.app"
          hdiutil detach "$RUNNER_TEMP/original-volume"
      - name: Verify all three downloads through the 2.6.4 Settings updater
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_VERSION: ${{ inputs.published_version }}
        run: node --experimental-strip-types scripts/qa-published-updates.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-update-verification
          retention-days: 3
          path: qa-output/public-updates/verification.json
          if-no-files-found: error
