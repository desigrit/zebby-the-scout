name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [desktop-sqlite]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
      - run: npm run desktop:build
      - run: npx electron-builder --win nsis --x64 --publish never -c electron-builder.local.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: pm-application-tracker-windows-x64
          path: desktop-packages/*-win-x64.exe
          if-no-files-found: error
      - run: node scripts/download-electron-arm64.mjs
      - run: npx electron-builder --win nsis --arm64 --publish never -c electron-builder.arm64.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: pm-application-tracker-windows-arm64
          path: desktop-packages/*-win-arm64.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - run: npx electron-builder --mac dmg --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: pm-application-tracker-macos-arm64
          path: desktop-packages/*-mac-arm64.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          pattern: pm-application-tracker-*
          path: release-files
          merge-multiple: true
      - name: Publish direct installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/*.exe release-files/*.dmg --title "PM Application Tracker $GITHUB_REF_NAME" --generate-notes --target "$GITHUB_SHA"
