name: Reference resume layout

on:
  pull_request:
    paths: ['desktop/resume*', 'desktop/tailored-resume*', 'desktop/main.ts', 'shared/tailored-resume.ts', 'tests/*resume*', 'tests/fixtures/reference-resume.mjs', 'scripts/*resume*', 'scripts/qa-tailored-files.mjs', 'scripts/build-desktop.mjs', 'public/resume-fonts/**', 'package*.json', '.github/workflows/resume-layout.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run desktop:build
      - run: npm run test:resume-files
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pdfplumber==0.11.8
      - run: python scripts/verify-resume-layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-layout-${{ matrix.os }}
          retention-days: 1
          path: |
            qa-output/tailored-resume/*.png
            qa-output/tailored-resume/*.json
            qa-output/tailored-resume/*.pdf
            qa-output/tailored-resume/*.docx
  word-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/prepare-resume-fixtures.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y libreoffice-writer fonts-crosextra-carlito
      - name: Render editable Word copies independently
        run: |
          mkdir -p qa-output/tailored-resume/converted
          libreoffice -env:UserInstallation=file:///tmp/zebby-word-layout --headless --convert-to pdf --outdir qa-output/tailored-resume qa-output/tailored-resume/word-reference.docx qa-output/tailored-resume/word-tailored.docx
          libreoffice -env:UserInstallation=file:///tmp/zebby-word-layout --headless --convert-to pdf --outdir qa-output/tailored-resume/converted qa-output/tailored-resume/pdf-tailored.docx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pdfplumber==0.11.8
      - run: python scripts/verify-resume-layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-word-compatibility
          retention-days: 1
          path: |
            qa-output/tailored-resume/*.png
            qa-output/tailored-resume/*.json
            qa-output/tailored-resume/converted/*.pdf
